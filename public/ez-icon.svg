<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EZ Marketing Agency">
  <title>EZ Marketing Agency</title>

  <!-- Monochrome black-glass tile matching the official EZ artwork
       (public/brand/ez-logo.png). -->
  <rect width="64" height="64" rx="16" fill="#0A0A0F" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Angular italic EZ wordmark -->
  <g fill="#F4F4F5" transform="translate(4.5 0) skewX(-8)">
    <!-- E -->
    <rect x="13" y="20" width="6.5" height="24" />
    <rect x="13" y="20" width="16" height="6.5" />
    <rect x="13" y="28.75" width="13.5" height="6.5" />
    <rect x="13" y="37.5" width="16" height="6.5" />

    <!-- Z with lightning slash -->
    <rect x="35" y="20" width="16" height="6.5" />
    <rect x="35" y="37.5" width="16" height="6.5" />
    <path d="M49.5 22 L36.5 41.5" stroke="#F4F4F5" stroke-width="6.5" fill="none" />
  </g>
</svg>
